# Pinned, and deliberately NOT derived from the directory name. Renaming the
# checkout must not orphan the running deployment: an implicit project name
# also names the `state` volume, so a rename would quietly hand the agent an
# empty volume and leave the old containers still running. Same reasoning as
# naming the wiki volume explicitly — a deployment outlives what it happens
# to be called on disk.
name: openplow-support

services:
  agent:
    # Named, so that the tag compose builds is the tag every script in
    # scripts/ looks for. Without it compose names the build after
    # project+service (`openplow-support-agent:latest`) while OPENPLOW_IMAGE
    # in scripts/lib.sh expects `openplow-support:local`: a fresh install then
    # builds the image, starts the container, and dies on the first helper that
    # runs `docker run "$OPENPLOW_IMAGE"`. The two names are read from the same
    # variable, so overriding it moves both.
    image: ${OPENPLOW_IMAGE:-openplow-support:local}
    build: .
    # Literal, never interpolated from the host: the base's reporter reads
    # AGENT_ID, and an inherited value would report this agent's usage as
    # somebody else's. Dockerfile sets the same value.
    environment:
      AGENT_ID: openplow-support
    env_file: ./plow-credentials
    # No `ports:` and no reverse proxy in front of this service, deliberately.
    # The agent is reached through the Plow channel and through
    # `docker compose exec agent openclaw …`, never over a published socket.
    # Anything that binds a host port here also becomes a browser-reachable
    # control surface: the base runs the Gateway with `auth.mode:
    # "trusted-proxy"` and `deviceAutoApprove.scopes: ["operator.admin"]`, so
    # whoever reaches that port is an administrator of the agent. A local-only
    # bind narrows the blast radius; publishing nothing removes it. If you need
    # the Control UI, reach it from inside the container instead of opening a
    # port on the host.
    # `state` is the runtime's own. `wiki` is organizational knowledge, and it
    # is NAMED, not a bind mount, because it has to outlive the container:
    # `docker compose down`, an image rebuild and a redeploy all keep it.
    # WIKI_PATH (set in the Dockerfile) points inside it, so the vault and its
    # history — $WIKI_PATH.git, which the wiki keeps beside itself — ride on the
    # same volume and cannot drift apart.
    volumes:
      - state:/var/lib/plow
      - config:/etc/plow/openclaw
      - wiki:/data
    stop_grace_period: 35s
  # There is no sidecar here. An earlier revision ran Caddy in front of the
  # agent to imitate Plow's own agent-web proxy, published on 127.0.0.1:3001.
  # It also re-created the admin problem it was meant to hide, and its
  # `network_mode: service:agent` binding was silently orphaned by the
  # installer's `docker compose restart agent`. Nothing in scripts/ talks to
  # that port, so it is gone rather than repaired.
volumes:
  state:
  # The base renders `$include` fragments here. Persist them with state so an
  # image rebuild cannot leave `/var/lib/plow/openclaw.json` referencing an
  # empty container filesystem.
  config:
  # Named EXPLICITLY, not `<project>_wiki`, and `external` because the scripts
  # in scripts/ create and read this volume WITHOUT compose (wiki-peek,
  # wiki-import, wiki-refresh all run as plain `docker run`). A compose-owned
  # volume would be second-guessed every `up` with "not created by Docker
  # Compose", and — worse — `docker compose down -v` would delete
  # organizational knowledge that the agent never owned.
  #
  # Create it once:  docker volume create openplow-wiki
  # Keep this name in step with scripts/lib.sh.
  wiki:
    name: openplow-wiki
    external: true
